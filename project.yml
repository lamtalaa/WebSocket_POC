name: WebSocketPOC
options:
  bundleIdPrefix: com.websocketlab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WebSocketPOC:
    type: application
    platform: iOS
    sources:
      - path: WebSocketPOC
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.websocketlab.app
        PRODUCT_NAME: WebSocketPOC
        INFOPLIST_FILE: WebSocketPOC/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WebSocket Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: "-"
schemes:
  WebSocketPOC:
    build:
      targets:
        WebSocketPOC: all
    run:
      config: Debug
